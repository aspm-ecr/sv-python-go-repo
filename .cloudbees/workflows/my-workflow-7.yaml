apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  workflow_dispatch:
metadata:
  stages/v1alpha1:
    - name: Stage 1
      jobs:
        - job1
        - Job1
    - name: Stage
      jobs:
        - job
jobs:
  job1:
    steps:
      - run: echo "hello world"
        uses: docker://golang:1.20.3-alpine3.17
        name: Hello world
        shell: sh
  Job1:
    needs: job1
    runs-on: linux
    environment: 15jan10202026
    steps:
      - name: test-step
        kind: scan
        uses: cloudbees-io/snyk-sast-scan-code@v1
        with:
          orgname: cloudbees-compliance-partner-development
          token: b805f82c-36ef-4f7d-aee5-16bfaa718f75
  job:
    needs:
      - Job1
    steps:
      - name: Say hello
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: echo "hello world"
